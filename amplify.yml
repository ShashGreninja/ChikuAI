# AWS Amplify Hosting build for the Next.js app in web/.
# Set API_URL (the App Runner URL) in Amplify's environment variables before the first build:
# Next.js bakes the /api/* proxy target in at build time.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 20
            - nvm use 20
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
