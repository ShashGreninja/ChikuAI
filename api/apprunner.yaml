version: 1.0
runtime: python311
build:
  commands:
    build:
      - python3 -m pip install --upgrade pip
run:
  runtime-version: 3.11
  # Dependencies are installed at pre-run so they live in the image App Runner actually runs.
  pre-run:
    - pip3 install -r requirements.txt
  command: python3 main.py
  network:
    port: 8000
    env: PORT
  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8000"
    - name: AWS_REGION
      value: "ap-south-1"
