version: 1.0
runtime: python311
build:
  commands:
    build:
      - python3 -m pip install --upgrade pip
run:
  runtime-version: 3.11
  # The revised Python 3.11 build drops packages installed during `build`,
  # so dependencies are installed at pre-run, inside the image App Runner actually runs.
  pre-run:
    - pip3 install -r requirements.txt
  command: python3 main.py
  network:
    port: 8000
    env: PORT
  env:
    - name: HOST
      value: "0.0.0.0"
    - name: PORT
      value: "8000"
    - name: AWS_REGION
      value: "ap-south-1"
    # AI features with Amazon Nova 2 Lite. Uncomment once the service has an instance role
    # that allows bedrock:InvokeModel and bedrock:InvokeModelWithResponseStream.
    # - name: BEDROCK_MODEL_ID
    #   value: "global.amazon.nova-2-lite-v1:0"
    # School report emails go out through Amazon SES from this verified address.
    # Uncomment and set it once the identity is verified in SES (same region).
    # - name: SES_SENDER
    #   value: "you@example.com"
    # Phone calls through Twilio: the caller ID and this service's own public URL.
    # - name: TWILIO_FROM_NUMBER
    #   value: "+1XXXXXXXXXX"
    # - name: PUBLIC_BASE_URL
    #   value: "https://xxxx.ap-south-1.awsapprunner.com"
  # Twilio credentials live in SSM Parameter Store (SecureString), never in this file.
  # The instance role needs ssm:GetParameters on both parameters.
  # secrets:
  #   - name: TWILIO_ACCOUNT_SID
  #     value-from: "arn:aws:ssm:ap-south-1:ACCOUNT_ID:parameter/chiku-ai/twilio-account-sid"
  #   - name: TWILIO_AUTH_TOKEN
  #     value-from: "arn:aws:ssm:ap-south-1:ACCOUNT_ID:parameter/chiku-ai/twilio-auth-token"
